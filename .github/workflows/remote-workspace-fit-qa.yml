name: Stock MSTSC file publisher warning
on:
  push:
    branches:
      - 'qa/remote-workspace-085-windows-publisher-*'
permissions:
  contents: read
jobs:
  dialog:
    runs-on: windows-2022
    timeout-minutes: 4
    steps:
      - name: Observe unsigned RDP files with clipboard off and on
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'Requires a disposable Windows runner.' }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $mstsc = Join-Path ([Environment]::SystemDirectory) 'mstsc.exe'
          foreach ($clipboard in 0,1) {
            $path = Join-Path $env:RUNNER_TEMP ("rw-unsigned-" + [Guid]::NewGuid().ToString('N') + '.rdp')
            $client = $null
            try {
              @(
                'full address:s:127.0.0.1:33949'
                'enablecredsspsupport:i:1'
                'authentication level:i:1'
                'prompt for credentials:i:1'
                'redirectsmartcards:i:1'
                "redirectclipboard:i:$clipboard"
                'redirectprinters:i:0'
                'drivestoredirect:s:'
              ) | Set-Content -LiteralPath $path -Encoding Unicode
              $client = Start-Process -FilePath $mstsc -ArgumentList ('"' + $path + '"') -PassThru
              $deadline = (Get-Date).AddSeconds(12)
              $state = 'not-observed'
              $condition = New-Object Windows.Automation.PropertyCondition ([Windows.Automation.AutomationElement]::ProcessIdProperty, $client.Id)
              do {
                $windows = [Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children, $condition)
                foreach ($window in $windows) {
                  $items = $window.FindAll([Windows.Automation.TreeScope]::Subtree, [Windows.Automation.Condition]::TrueCondition)
                  foreach ($item in $items) {
                    try { $name = $item.Current.Name } catch [Windows.Automation.ElementNotAvailableException] { continue }
                    if ($name -match 'unknown publisher|publisher of this remote connection|unknown remote connection') {
                      $state = 'shown'
                      break
                    }
                  }
                  if ($state -eq 'shown') { break }
                }
                if ($state -eq 'shown') { break }
                Start-Sleep -Milliseconds 500
              } while ((Get-Date) -lt $deadline -and !$client.HasExited)
              "UNSIGNED_RDP clipboard=$clipboard publisher-warning=$state"
            }
            finally {
              if ($client) {
                if (!$client.HasExited) {
                  $client.Kill()
                  $null = $client.WaitForExit(2000)
                }
                $client.Dispose()
              }
              Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            }
          }
