name: Windows VM lab capacity
on:
  push:
    branches:
      - 'qa/remote-workspace-085-windows-vm-preflight-*'
permissions:
  contents: read
jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify the isolated runner can create a KVM guest
        run: |
          uname -m
          df -h "$RUNNER_TEMP"
          free -h
          sudo -n python3 - <<'PY'
          import os
          import fcntl
          try:
              fd = os.open('/dev/kvm', os.O_RDWR)
          except OSError as err:
              print('KVM=' + str(err))
          else:
              with os.fdopen(fd, 'rb', buffering=0) as handle:
                  print(f'KVM_API_VERSION={fcntl.ioctl(handle, 0xAE00)}')
                  vm_fd = fcntl.ioctl(handle, 0xAE01, 0)
                  os.close(vm_fd)
                  print('KVM_CREATE_VM=PASS')
          PY
