name: Remote Workspace Win32 frame QA
on:
  push:
    branches:
      - 'qa/remote-workspace-083-windows-*'
permissions:
  contents: write
jobs:
  frame:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Reproduce the offset with 0.8.2 and check the candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:GITHUB_REPOSITORY -ne 'PastFly/Remote-Workspace') { throw 'This test needs the repository runner.' }
          $lab = Join-Path $env:RUNNER_TEMP 'remote-workspace-qa'
          New-Item -Path $lab -ItemType Directory | Out-Null
          gh release download 'v0.8.2' --repo $env:GITHUB_REPOSITORY --pattern 'Remote-Workspace-0.8.2-x64.msi' --dir $lab
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download baseline.' }
          $draft = 'qa-windows-083-20261127'
          $isDraft = gh release view $draft --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'true') { throw 'Expected a private Windows QA draft.' }
          gh release download $draft --repo $env:GITHUB_REPOSITORY --pattern 'Remote-Workspace-0.8.3-x64.msi' --pattern 'NativeViewportOriginSmoke.exe' --pattern 'NativeMstscCloseSmoke.exe' --dir $lab
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download QA assets.' }
          $env:GH_TOKEN = $null
          function Install([string]$Version, [string]$Hash) {
            $msi = Join-Path $lab "Remote-Workspace-$Version-x64.msi"
            if ((Get-FileHash -LiteralPath $msi).Hash -ne $Hash) { throw "Incorrect digest for $Version" }
            $msiexec = Join-Path ([Environment]::SystemDirectory) 'msiexec.exe'
            $proc = Start-Process -FilePath $msiexec -ArgumentList @('/i', ('"'+$msi+'"'), '/qn', '/norestart') -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Unexpected MSI exit: $($proc.ExitCode)." }
          }
          $app = Join-Path $env:ProgramFiles 'Remote Workspace/RemoteWorkspace.exe'
          $fixture = Join-Path $lab 'NativeViewportOriginSmoke.exe'
          if ((Get-FileHash -LiteralPath $fixture).Hash -ne '7226dd2c6b43b6631d04e420d658cac2a81071f902911442a8c4737b12e3c8f0') { throw 'Incorrect fixture digest' }
          Install '0.8.2' '9de1404f7d700120d2d83e97635a4c4d9fb85a63c065b5eaa3bc8caaab9ffe71'
          & $fixture $app --expect-082-crop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Install '0.8.3' '33ecc0972be70ceb2188110d85fa518927e6e4555ded26d6a7cf8fddcd03fd25'
          & $fixture $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $closeFixture = Join-Path $lab 'NativeMstscCloseSmoke.exe'
          if ((Get-FileHash -LiteralPath $closeFixture).Hash -ne 'c36840e7464341aceda33e7c6272a8f5e86c70c4fb7e4265eb984fa49bbbc2be') { throw 'Incorrect process fixture digest' }
          & $closeFixture $app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
