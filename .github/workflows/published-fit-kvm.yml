name: Published Remote Workspace live resize in KVM
on:
  push:
    branches:
      - 'qa/remote-workspace-085-published-fit-*'
permissions:
  contents: read
jobs:
  published-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check published 0.8.4 against a private, authenticated RDP fixture
        shell: bash
        run: bash qa/windows-kvm/run-published-fit-kvm.sh
