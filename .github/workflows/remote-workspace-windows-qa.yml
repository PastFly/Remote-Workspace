name: Remote Workspace Windows QA
on:
  push:
    branches:
      - 'qa/remote-workspace-082-windows-*'
permissions:
  contents: write
jobs:
  installed-preview-worker:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Test the installed Preview updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_OS -ne 'Windows' -or $env:GITHUB_REPOSITORY -ne 'PastFly/Remote-Workspace') {
            throw 'Run this fixture only on the disposable repository runner.'
          }
          $lab = Join-Path $env:RUNNER_TEMP 'remote-workspace-qa'
          New-Item -Path $lab -ItemType Directory | Out-Null
          $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/.github/qa/Test-InstalledPreviewWorker.ps1?ref=$env:GITHUB_SHA" --jq .content
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the test fixture.' }
          $script = Join-Path $lab 'Test-InstalledPreviewWorker.ps1'
          [IO.File]::WriteAllBytes($script, [Convert]::FromBase64String(($encoded -join '')))
          $draft = 'qa-windows-082-20261127'
          $isDraft = gh release view $draft --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $isDraft -ne 'true') { throw 'Expected the private Windows QA draft.' }
          gh release download $draft --repo $env:GITHUB_REPOSITORY --pattern '*' --dir $lab
          if ($LASTEXITCODE -ne 0) { throw 'Could not download signed draft QA assets.' }
          Write-Host "SESSION_INTERACTIVE=$([Environment]::UserInteractive) SESSION_ID=$((Get-Process -Id $PID).SessionId)"
          $fixture = Join-Path $lab 'NativeViewportWin32Smoke.exe'
          $env:GH_TOKEN = $null
          & $script -DisposableLab -BaselineMsi (Join-Path $lab 'Remote-Workspace-0.8.1-QA-base-x64.msi') -BaselineVersion '0.8.1' -TargetMsi (Join-Path $lab 'Remote-Workspace-0.8.2-x64.msi') -TargetSignature (Join-Path $lab 'Remote-Workspace-0.8.2-x64.msi.sig') -TargetVersion '0.8.2' -BaselineSha256 'fe24b3a04327bdf36ab9d6166664cba9708727626616a949a5dfa5c93092b9fa' -TargetSha256 '9de1404f7d700120d2d83e97635a4c4d9fb85a63c065b5eaa3bc8caaab9ffe71' -VerifyRestart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $fixture (Join-Path $env:ProgramFiles 'Remote Workspace/RemoteWorkspace.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
