name: Disposable Windows Server boot
on:
  push:
    branches:
      - 'qa/remote-workspace-085-windows-kvm-*'
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and boot a stock Windows Server evaluation guest
        shell: bash
        run: bash qa/windows-kvm/run-windows-kvm-boot.sh
